services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - /opt/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend_network
    restart: unless-stopped

  portfolio-backend:
    image: hysteria9/portfolio-backend:latest
    container_name: portfolio-backend
    pull_policy: always
    ports: []
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    labels:
      - com.centurylinklabs.watchtower.scope=backend_network
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 3600s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_REGISTRY_AUTH_FILE=/config.json
    command: --scope backend_network --cleanup --revive-stopped --debug
    networks:
      - backend_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports: []
    networks:
      - backend_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_HINT=true
      - GF_SERVER_PROTOCOL=http
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.api.anthonyrovira.com
      - GF_SERVER_DOMAIN=grafana.api.anthonyrovira.com
      - GF_SERVER_HTTP_PORT=3003
    networks:
      - backend_network
    restart: unless-stopped
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - backend_network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  backend_network:
    name: backend_network
    driver: bridge
